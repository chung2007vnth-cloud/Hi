<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Particle System - Hand & Face Control</title>
    
    <style>
        :root {
            --primary: #00ffff;
            --secondary: #ff0055;
            --glass: rgba(15, 15, 15, 0.75);
            --border: rgba(255, 255, 255, 0.15);
            --text-color: #eee;
        }

        body {
            margin: 0; overflow: hidden; background-color: #050505;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-color); user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Canvas 3D */
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }

        /* Video Input (Ẩn) */
        #input-video { position: absolute; top: 0; left: 0; opacity: 0; pointer-events: none; z-index: -1; transform: scaleX(-1); }

        /* Watermark - Bắt buộc */
        #watermark {
            position: absolute; bottom: 15px; right: 20px;
            font-size: 14px; font-weight: 600; color: rgba(255, 255, 255, 0.3);
            z-index: 100; font-family: monospace; pointer-events: none;
        }

        /* Loading Screen */
        #loader {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; transition: opacity 0.6s;
        }
        .spinner {
            width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid var(--primary); border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Menu Điều Khiển (Góc trên trái) */
        #control-panel {
            position: absolute; top: 20px; left: 20px; width: 260px;
            background: var(--glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border); border-radius: 16px;
            padding: 20px; z-index: 10;
            transition: opacity 0.4s ease, transform 0.4s ease;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            max-height: 80vh; overflow-y: auto;
        }

        /* Ẩn menu khi không tương tác (sẽ được xử lý bằng JS) */
        #control-panel.faded { opacity: 0.3; transform: scale(0.98); pointer-events: none; }
        #control-panel:hover { opacity: 1 !important; transform: scale(1) !important; pointer-events: auto; }

        h2 { font-size: 16px; margin: 0 0 15px 0; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--border); padding-bottom: 8px;}
        
        /* Hướng dẫn cử chỉ */
        .guide-item { display: flex; align-items: center; margin-bottom: 8px; font-size: 12px; color: #bbb; }
        .icon { width: 24px; text-align: center; margin-right: 10px; font-size: 16px; }

        /* Controls */
        .control-group { margin-top: 15px; }
        label { display: block; font-size: 11px; color: #888; margin-bottom: 5px; }
        input[type="range"] { width: 100%; accent-color: var(--primary); margin-bottom: 10px; }
        input[type="color"] { width: 100%; border: none; background: none; height: 30px; cursor: pointer; padding: 0; }
        
        /* File Upload */
        .custom-file-upload {
            display: block; padding: 8px; margin-top: 10px;
            background: rgba(255,255,255,0.05); border-radius: 6px;
            text-align: center; font-size: 12px; cursor: pointer; border: 1px dashed #555;
            transition: 0.3s;
        }
        .custom-file-upload:hover { background: rgba(255,255,255,0.1); border-color: var(--primary); }
        input[type="file"] { display: none; }

        /* Status Indicator */
        #status-bar {
            margin-top: 15px; padding-top: 10px; border-top: 1px solid var(--border);
            font-size: 11px; color: var(--primary); display: flex; align-items: center;
        }
        .dot { width: 8px; height: 8px; background: #333; border-radius: 50%; margin-right: 8px; transition: 0.3s;}
        .dot.active { background: #00ff88; box-shadow: 0 0 8px #00ff88; }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <div id="loader-text" style="font-size: 12px; color: #888;">Khởi tạo Camera & AI...</div>
    </div>

    <div id="control-panel">
        <h2>Bảng Điều Khiển</h2>
        
        <div class="guide-section">
            <div class="guide-item"><span class="icon">✋</span> Xòe tay: Phóng to (Cầu)</div>
            <div class="guide-item"><span class="icon">✊</span> Nắm tay: Thu nhỏ (Tim)</div>
            <div class="guide-item"><span class="icon">👌</span> OK: Mở ảnh zoom</div>
            <div class="guide-item"><span class="icon">✌️</span> 2 Ngón: Reset</div>
            <div class="guide-item"><span class="icon">↔️</span> Di chuyển: Xoay khối</div>
        </div>

        <div class="control-group">
            <label>Màu hạt (Particles)</label>
            <input type="color" id="color-particle" value="#00ffff">
            
            <label>Màu hào quang (Halo)</label>
            <input type="color" id="color-halo" value="#ff0055">
            
            <label>Độ sáng</label>
            <input type="range" id="brightness" min="0.1" max="2" step="0.1" value="1">
            
            <label class="custom-file-upload">
                📂 Tải ảnh lên (Max 5)
                <input type="file" id="image-upload" accept="image/*" multiple>
            </label>
        </div>

        <div id="status-bar">
            <div class="dot" id="status-dot"></div>
            <span id="status-text">Đang đợi camera...</span>
        </div>
    </div>

    <video id="input-video" playsinline></video>
    <div id="canvas-container"></div>
    <div id="watermark">@by:hutxito</div>

    <script>
        /**
         * @by:hutxito
         * Single File Solution: Three.js + MediaPipe (Hands & Face)
         * No external frameworks. Optimized for mobile.
         */

        // --- 1. CẤU HÌNH & TRẠNG THÁI ---
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        
        const CONFIG = {
            particleCount: isMobile ? 1500 : 4000, // Giảm số hạt trên mobile
            particleSize: isMobile ? 0.6 : 0.4,
            lerpFactor: 0.1, // Độ mượt chuyển động
            cameraZ: 40
        };

        const STATE = {
            targetShape: 'sphere', // 'sphere' | 'heart'
            gesture: 'None',
            handDetected: false,
            faceDetected: false,
            rotationTarget: { x: 0, y: 0 },
            zoomLevel: 1,
            images: [],
            currentImageIndex: 0,
            showImage: false,
            lastInteractionTime: Date.now()
        };

        // --- 2. KHỞI TẠO THREE.JS ---
        let scene, camera, renderer;
        let particles, geometry, material;
        let haloMesh; // Vòng sáng
        let imageMesh; // Mesh hiển thị ảnh
        let spherePos = [], heartPos = [], defaultPos = [];

        function initThree() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050505, 0.02);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = CONFIG.cameraZ;

            renderer = new THREE.WebGLRenderer({ antialias: !isMobile, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // Ánh sáng
            scene.add(new THREE.AmbientLight(0xffffff, 0.5));
            const pointLight = new THREE.PointLight(0xffffff, 1);
            pointLight.position.set(10, 10, 10);
            scene.add(pointLight);

            createParticles();
            createHalo();
            createImagePlane();

            // Resize event
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
        }

        function createParticles() {
            geometry = new THREE.BufferGeometry();
            const positions = [];
            const colors = [];
            const colorObj = new THREE.Color(document.getElementById('color-particle').value);

            for (let i = 0; i < CONFIG.particleCount; i++) {
                // 1. Tạo vị trí hình cầu (Sphere)
                const phi = Math.acos(-1 + (2 * i) / CONFIG.particleCount);
                const theta = Math.sqrt(CONFIG.particleCount * Math.PI) * phi;
                const r = 14;

                const sx = r * Math.cos(theta) * Math.sin(phi);
                const sy = r * Math.sin(theta) * Math.sin(phi);
                const sz = r * Math.cos(phi);

                spherePos.push(sx, sy, sz);
                defaultPos.push(sx, sy, sz); // Lưu vị trí gốc để reset
                positions.push(sx, sy, sz);   // Vị trí ban đầu

                // 2. Tạo vị trí hình trái tim (Heart)
                // Công thức: x=16sin^3(t), y=13cos(t)-5cos(2t)-2cos(3t)-cos(4t)
                const t = Math.random() * Math.PI * 2;
                const hScale = 0.8; 
                // Thêm độ dày (thickness) ngẫu nhiên
                const thickness = (Math.random() - 0.5) * 6;

                let hx = 16 * Math.pow(Math.sin(t), 3);
                let hy = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
                let hz = thickness;

                heartPos.push(hx * hScale, hy * hScale, hz * hScale);
                colors.push(colorObj.r, colorObj.g, colorObj.b);
            }

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

            const sprite = new THREE.TextureLoader().load('https://threejs.org/examples/textures/sprites/disc.png');

            material = new THREE.PointsMaterial({
                size: CONFIG.particleSize,
                map: sprite,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                transparent: true,
                opacity: 0.8
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);
        }

        function createHalo() {
            const geo = new THREE.TorusGeometry(13, 0.2, 16, 100);
            const mat = new THREE.MeshBasicMaterial({ 
                color: document.getElementById('color-halo').value, 
                transparent: true, opacity: 0,
                blending: THREE.AdditiveBlending
            });
            haloMesh = new THREE.Mesh(geo, mat);
            scene.add(haloMesh);
        }

        function createImagePlane() {
            // Plane để hiển thị ảnh ở giữa
            const geo = new THREE.PlaneGeometry(16, 16); // Tỷ lệ vuông mặc định
            const mat = new THREE.MeshBasicMaterial({ 
                color: 0xffffff, side: THREE.DoubleSide, 
                transparent: true, opacity: 0 
            });
            imageMesh = new THREE.Mesh(geo, mat);
            imageMesh.visible = false;
            scene.add(imageMesh);
        }

        // --- 3. XỬ LÝ ANIMATION & LOGIC ---
        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001;
            
            // UI Auto Hide Logic
            const panel = document.getElementById('control-panel');
            if (Date.now() - STATE.lastInteractionTime > 3000 && !STATE.faceDetected) {
                panel.classList.add('faded');
            } else {
                panel.classList.remove('faded');
            }

            // --- Particle Morphing ---
            const positions = geometry.attributes.position.array;
            const isHeart = STATE.targetShape === 'heart';

            for (let i = 0; i < CONFIG.particleCount; i++) {
                const idx = i * 3;
                let tx, ty, tz;

                if (isHeart) {
                    tx = heartPos[idx]; ty = heartPos[idx+1]; tz = heartPos[idx+2];
                } else {
                    tx = spherePos[idx]; ty = spherePos[idx+1]; tz = spherePos[idx+2];
                    // Hiệu ứng "Breathing" nhẹ cho cầu
                    if (STATE.targetShape === 'sphere') {
                        const noise = Math.sin(time * 2 + spherePos[idx]*0.2) * 0.3;
                        tx += noise; ty += noise; tz += noise;
                    }
                }

                // Lerp (Làm mượt chuyển động)
                positions[idx] += (tx - positions[idx]) * CONFIG.lerpFactor;
                positions[idx+1] += (ty - positions[idx+1]) * CONFIG.lerpFactor;
                positions[idx+2] += (tz - positions[idx+2]) * CONFIG.lerpFactor;
            }
            geometry.attributes.position.needsUpdate = true;

            // --- Controls (Xoay, Zoom) ---
            // Xoay dựa trên vị trí tay
            particles.rotation.y += (STATE.rotationTarget.y - particles.rotation.y) * 0.05;
            particles.rotation.x += (STATE.rotationTarget.x - particles.rotation.x) * 0.05;
            haloMesh.rotation.copy(particles.rotation);

            // Zoom toàn bộ hệ thống
            const currentScale = particles.scale.x;
            const targetScale = STATE.zoomLevel;
            particles.scale.setScalar(currentScale + (targetScale - currentScale) * 0.05);
            haloMesh.scale.setScalar(currentScale + (targetScale - currentScale) * 0.05);

            // --- Halo Effect ---
            if (isHeart) {
                haloMesh.material.opacity += (0.7 - haloMesh.material.opacity) * 0.05;
                haloMesh.rotation.z -= 0.02; // Tự xoay
            } else {
                haloMesh.material.opacity += (0 - haloMesh.material.opacity) * 0.1;
            }

            // --- Image Logic (Cử chỉ OK) ---
            if (STATE.showImage && STATE.images.length > 0) {
                imageMesh.visible = true;
                // Fade in ảnh
                imageMesh.material.opacity += (1 - imageMesh.material.opacity) * 0.05;
                // Fade out hạt để tập trung vào ảnh
                material.opacity += (0.2 - material.opacity) * 0.05;
                
                // Hiệu ứng zoom ảnh ra từ tâm
                imageMesh.scale.lerp(new THREE.Vector3(1, 1, 1), 0.1);
                // Luôn hướng về camera
                imageMesh.lookAt(camera.position);

            } else {
                // Ẩn ảnh
                imageMesh.material.opacity += (0 - imageMesh.material.opacity) * 0.1;
                if(imageMesh.material.opacity < 0.05) imageMesh.visible = false;
                imageMesh.scale.set(0.1, 0.1, 0.1);
                
                // Hiện hạt lại
                const bright = document.getElementById('brightness').value;
                material.opacity += (bright - material.opacity) * 0.05;
            }

            renderer.render(scene, camera);
        }

        // --- 4. XỬ LÝ AI (MEDIAPIPE HANDS & FACE) ---
        
        // Hàm tiện ích tính khoảng cách Euclidean 2D
        function dist(p1, p2) {
            return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
        }

        function onHandResults(results) {
            const statusDot = document.getElementById('status-dot');
            const statusText = document.getElementById('status-text');
            
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                STATE.handDetected = true;
                STATE.lastInteractionTime = Date.now();
                statusDot.className = "dot active";
                statusText.innerText = "Đã nhận diện tay: " + STATE.gesture;

                const lm = results.multiHandLandmarks[0];

                // 1. Phân tích cử chỉ
                // Đếm ngón tay mở (Tip cao hơn khớp PIP theo trục Y)
                const tips = [8, 12, 16, 20];
                const pips = [6, 10, 14, 18];
                let fingersOpen = 0;
                
                tips.forEach((tip, i) => {
                    if (lm[tip].y < lm[pips[i]].y) fingersOpen++;
                });
                // Ngón cái (dựa vào trục X)
                if (Math.abs(lm[4].x - lm[17].x) > Math.abs(lm[3].x - lm[17].x)) fingersOpen++;

                // Nhận diện "OK" (Trỏ chạm Cái)
                const isOK = dist(lm[4], lm[8]) < 0.05;

                // Xử lý trạng thái
                if (isOK) {
                    STATE.gesture = 'OK - Xem Ảnh';
                    STATE.showImage = true;
                } else {
                    STATE.showImage = false;
                    
                    if (fingersOpen === 5) {
                        STATE.gesture = 'Open - Phóng to';
                        STATE.targetShape = 'sphere';
                    } else if (fingersOpen === 0) {
                        STATE.gesture = 'Fist - Thu nhỏ';
                        STATE.targetShape = 'heart';
                    } else if (fingersOpen === 2 && !isOK) {
                        // Kiểm tra kỹ: Chỉ ngón trỏ(8) và giữa(12) mở
                        if(lm[8].y < lm[6].y && lm[12].y < lm[10].y) {
                            STATE.gesture = 'Victory - Reset';
                            resetSystem();
                        }
                    } else {
                        STATE.gesture = 'Moving';
                    }
                }

                // 2. Điều khiển Xoay & Nâng hạ (Dựa vào vị trí cổ tay)
                const handX = lm[0].x; 
                const handY = lm[0].y;
                // Map [0,1] -> [-1.5, 1.5] rad
                STATE.rotationTarget.y = (handX - 0.5) * 3;
                STATE.rotationTarget.x = (handY - 0.5) * 3;

                // 3. Zoom (Dựa vào kích thước tay: Cổ tay đến Ngón giữa)
                const handSize = dist(lm[0], lm[9]);
                // Map handSize 0.1->0.4 sang Scale 0.5->2.5
                let s = (handSize - 0.1) * 7;
                STATE.zoomLevel = Math.max(0.5, Math.min(s, 2.5));

            } else {
                STATE.handDetected = false;
                if (!STATE.faceDetected) {
                    statusDot.className = "dot";
                    statusText.innerText = "Đang tìm tay hoặc mặt...";
                }
            }
        }

        function onFaceResults(results) {
            // Face Detection chủ yếu dùng để giữ Menu hiển thị
            if (results.detections.length > 0) {
                STATE.faceDetected = true;
                if (!STATE.handDetected) {
                    document.getElementById('status-text').innerText = "Đã thấy khuôn mặt (Menu bật)";
                    document.getElementById('status-dot').className = "dot active";
                    STATE.lastInteractionTime = Date.now(); // Giữ menu sáng
                }
            } else {
                STATE.faceDetected = false;
            }
        }

        function resetSystem() {
            STATE.targetShape = 'sphere';
            STATE.zoomLevel = 1;
            particles.rotation.set(0,0,0);
            
            // Đưa hạt về vị trí mặc định ngay lập tức (hoặc nhanh)
            const positions = geometry.attributes.position.array;
            for(let i=0; i<CONFIG.particleCount; i++) {
                const idx = i*3;
                spherePos[idx] = defaultPos[idx];
                spherePos[idx+1] = defaultPos[idx+1];
                spherePos[idx+2] = defaultPos[idx+2];
            }
        }

        // --- 5. UI EVENTS ---
        document.getElementById('color-particle').addEventListener('input', (e) => {
            if(material) {
                const c = new THREE.Color(e.target.value);
                const colors = geometry.attributes.color.array;
                for(let i=0; i<colors.length; i+=3) { colors[i]=c.r; colors[i+1]=c.g; colors[i+2]=c.b; }
                geometry.attributes.color.needsUpdate = true;
            }
            STATE.lastInteractionTime = Date.now();
        });

        document.getElementById('color-halo').addEventListener('input', (e) => {
            if(haloMesh) haloMesh.material.color.set(e.target.value);
            STATE.lastInteractionTime = Date.now();
        });

        document.getElementById('brightness').addEventListener('input', (e) => {
            STATE.lastInteractionTime = Date.now();
            // Giá trị này sẽ được dùng trong animate loop
        });

        document.getElementById('image-upload').addEventListener('change', (e) => {
            const files = e.target.files;
            if (files.length === 0) return;
            
            STATE.images = []; // Reset ảnh cũ
            const limit = Math.min(files.length, 5);
            const loader = new THREE.TextureLoader();

            for(let i=0; i<limit; i++) {
                const reader = new FileReader();
                reader.onload = (evt) => {
                    const tex = loader.load(evt.target.result);
                    STATE.images.push(tex);
                    // Mặc định load ảnh đầu tiên vào mesh
                    if(i===0) imageMesh.material.map = tex;
                    imageMesh.material.needsUpdate = true;
                };
                reader.readAsDataURL(files[i]);
            }
            alert(`Đã tải ${limit} ảnh! Làm dấu OK (👌) để xem.`);
        });

        // --- 6. KHỞI CHẠY HỆ THỐNG ---
        async function startSystem() {
            initThree();

            const video = document.getElementById('input-video');
            const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
            
            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });
            hands.onResults(onHandResults);

            const face = new FaceDetection({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`});
            face.setOptions({ model: 'short', minDetectionConfidence: 0.5 });
            face.onResults(onFaceResults);

            const cameraUtils = new Camera(video, {
                onFrame: async () => {
                    await hands.send({image: video});
                    // Chạy face detection ít thường xuyên hơn để tiết kiệm hiệu năng (optional)
                    await face.send({image: video}); 
                },
                width: 640, height: 480
            });

            try {
                await cameraUtils.start();
                document.getElementById('loader').style.opacity = 0;
                setTimeout(()=> document.getElementById('loader').remove(), 600);
            } catch (e) {
                alert("Lỗi Camera! Hãy đảm bảo bạn đang chạy HTTPS hoặc Localhost.");
            }
        }

        startSystem();

    </script>
</body>
</html>
